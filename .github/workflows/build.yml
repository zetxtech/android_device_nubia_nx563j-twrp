name: Build TWRP (nx563j)

on:
  push:
    branches: [android-12.1, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install host dependencies
        run: |
          sudo apt update && sudo apt upgrade -y
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 lib32ncurses-dev x11proto-core-dev libx11-dev \
            lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            bc ccache liblz4-tool libncurses-dev squashfs-tools lzop pngcrush \
            schedtool imagemagick libbz2-dev python3

      - name: Install OpenJDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize repo (minimal manifest, twrp-12.1)
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "TWRP Build"
          git config --global user.email "twrp@localhost"
          repo init --depth=1 -u \
            https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1
        id: pwd

      - name: Repo sync
        run: repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        working-directory: workspace

      - name: Clone device tree
        run: |
          git clone https://github.com/zetxtech/android_device_nubia_nx563j-twrp.git \
            -b android-12.1 ./device/nubia/nx563j
        working-directory: workspace

      - name: Set swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Build recovery image
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_nx563j-eng
          make recoveryimage -j$(nproc --all) 2>&1 | tee build.log
        working-directory: workspace

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: nx563j-recovery
          path: workspace/out/target/product/nx563j/recovery.img
          if-no-files-found: error